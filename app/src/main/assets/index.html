<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAXTER PLAYER — Your Videos. Your Control.</title>
  <style>
    :root {
      --bg-amoled: #000000;
      --bg-card: #141417;
      --accent-orange: #FF6700;
      --text-primary: #FFFFFF;
      --text-muted: #A0A0AB;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-amoled);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 103, 0, 0.35);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
    }
    .maxter-logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      display: block;
      margin: 0 auto 16px auto;
      border-radius: 24px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .tagline {
      color: var(--accent-orange);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      background: rgba(255, 103, 0, 0.15);
      color: var(--accent-orange);
      border: 1px solid var(--accent-orange);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <img
      src="images/maxter-player.png"
      alt="MAXTER PLAYER Logo"
      class="maxter-logo"
    />
    <h1>MAXTER PLAYER</h1>
    <p class="tagline">Your Videos. Your Control.</p>
    <span class="badge">v2.0.0-AI • Media3 ExoPlayer &amp; Smart Enhance</span>
  </div>
</body>
</html>
